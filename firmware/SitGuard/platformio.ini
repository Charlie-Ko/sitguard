; SitGuard · 久坐坐姿哨兵（M5Stack StickS3 / K150）
; 编译：pio run
; 烧录：pio run -t upload
; 串口：pio device monitor
;
; 板型说明：PlatformIO 的 espressif32 平台没有 m5stack-sticks3.json，
; 按 M5Stack 官方文档用 esp32-s3-devkitc-1 + qio_opi（8MB Flash + 8MB OPI PSRAM）。
; M5Unified 会自行探测出 board_M5StickS3，屏幕/IMU/按键都按 StickS3 初始化。

[platformio]
src_dir = .

[env:sticks3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; 依赖库在工程外（src_dir = . 会把工程内子目录当源码编译）。
; 本机：libs/ 是符号链接，指向另一个项目里已下载的 M5Unified / M5GFX。
; 新机器：libs/ 不存在，下面这行会指向一个空路径，改用 registry 装（见 README「依赖库」）：
;   pio pkg install -l "m5stack/M5Unified@0.2.26" --no-save
;   pio pkg install -l "m5stack/M5GFX@0.2.33" --no-save
lib_extra_dirs = ../../libs

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

; ESP32-S3 原生 USB-Serial-JTAG 的坑：
; esptool 默认用 --before default_reset，打开端口后发复位信号会让 USB 断开重枚举，
; macOS 重建 /dev 节点跟不上，报 "Could not configure port: (6)"。
; 解决：先用 1200bps touch 让芯片进下载模式，再以 no_reset 连接（见 flash.sh）。
upload_flags = --before=no_reset
